name: Create resized image test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resize-image-test.yml"
      - "scripts/resize_image_test.py"
      - "images/characters/kuro/kuro_happy_neon_cafe.png"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python scripts/resize_image_test.py
      - name: Commit resized test image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/characters/kuro/kuro_happy_neon_cafe_resized_test.png
          git diff --cached --quiet || (git commit -m "Add resized Kuro image test" && git push)
